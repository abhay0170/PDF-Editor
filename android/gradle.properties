org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# Kotlin's incremental compiler computes cache paths relative to the module
# root; when the pub cache (C:) and the project (D:) are on different drive
# roots on Windows, that computation throws ("this and base files have
# different roots") and crashes the build. Disable incremental compilation
# to avoid it.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
